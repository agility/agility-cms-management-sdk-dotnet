name: Release

# Publishes to NuGet when a version tag is pushed, e.g. v2.0.0 or v2.1.0-beta.1.
# The tag must match <Version> in src/Agility.Management.Sdk/Agility.Management.Sdk.csproj.
#
# Uses NuGet Trusted Publishing (OIDC): no API key is stored in the repo. One-time setup on nuget.org by a
# package owner: add a trusted publishing policy for this repository and workflow (release.yml), and set the
# NUGET_USER repository variable to that owner's nuget.org user name.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    env:
      CI: true
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check the tag matches the project version
        run: |
          version=$(dotnet msbuild src/Agility.Management.Sdk -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match project version $version."
            exit 1
          fi

      - name: Build and test
        run: |
          dotnet build -c Release
          dotnet test --no-build -c Release

      - name: Pack
        run: dotnet pack src/Agility.Management.Sdk --no-build -c Release -o artifacts

      - name: Get a short-lived NuGet API key
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
